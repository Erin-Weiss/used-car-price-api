## Stable network endpoint that load-balances across API Pods.
## Uses NodePort for local Minikube access; switch to ClusterIP
## when placing behind an Ingress in production.
apiVersion: v1
kind: Service
metadata:
  name: used-car-price-api
  namespace: used-car-price-api
  labels:
    app.kubernetes.io/name: used-car-price-api
    app.kubernetes.io/component: api
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: used-car-price-api
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      nodePort: 30080
