# ============================================================
# CI Pipeline — Used Car Price API
# ============================================================
# Runs on every push and pull request to main.
# Jobs: test, docker-build, validate-k8s, integration-test (main only)

name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "docs/**"
      - "LICENSE"
      - ".gitignore"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # --------------------------------------------------------
  # Job 1: Run the pytest unit test suite
  # --------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'dev-requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ --ignore=tests/test_integration.py -v --tb=short

  # --------------------------------------------------------
  # Job 2: Build the Docker image
  # --------------------------------------------------------
  # Checks out LFS files so the real model is available in
  # the build context. Verifies the Dockerfile builds
  # successfully without pushing anywhere.
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: used-car-price-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------------
  # Job 3: Validate Kubernetes manifests
  # --------------------------------------------------------
  # Catches YAML mistakes, wrong API versions, and missing
  # required fields before they reach a cluster.
  validate-k8s:
    name: K8s Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | tar xz -C /usr/local/bin

      - name: Validate manifests
        run: |
          kubeconform \
            -strict \
            -summary \
            -output text \
            k8s/*.yaml

  # --------------------------------------------------------
  # Job 4: Run integration tests with the real CatBoost model
  # --------------------------------------------------------
  # Only runs on pushes to main (not PRs). Downloads the real
  # model file via Git LFS and verifies end-to-end predictions
  # against the actual trained model.
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Verify model file is real (not an LFS pointer)
        run: |
          ls -lh models/catboost_final.cbm
          test $(wc -c < models/catboost_final.cbm) -gt 1000000

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt', 'dev-requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r dev-requirements.txt

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v --tb=short

  # --------------------------------------------------------
  # Job 5: Publish to GitHub Container Registry (GHCR)
  # --------------------------------------------------------
  # Only runs on pushes to main (not PRs) and only after
  # every other check passes. Tags with both :latest and the
  # exact commit SHA so deployments are reproducible.
  publish-image:
    name: Publish Image
    runs-on: ubuntu-latest
    needs: [test, docker-build, validate-k8s, integration-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code with Git LFS
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Set up QEMU (for multi-platform builds)
        uses: docker/setup-qemu-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/erin-weiss/used-car-price-api:latest
            ghcr.io/erin-weiss/used-car-price-api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max